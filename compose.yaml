# =====================================================================
# CODIHA 用 compose.yaml
#
# 構成: Express(Node.js) アプリ（Application/）+ MySQL
#
# 使い方:
#   docker compose up          # 開発サーバー起動
#   docker compose up --build  # Dockerfile変更後の再ビルド込みで起動
#   docker compose down        # 停止・コンテナ削除
#   docker compose down -v     # 停止・コンテナ・DBボリュームまで削除
#
# 初回のみ: DB起動後にスキーマを流し込む
#   docker compose exec -T db mysql -u codiha -pcodiha codiha < Application/SQL/001_init.sql
# =====================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./Application:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=codiha
      - DB_PASSWORD=codiha
      - DB_NAME=codiha
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=codiha
      - MYSQL_USER=codiha
      - MYSQL_PASSWORD=codiha
    ports:
      - "3306:3306"   # ホストから直接接続したい場合用（不要なら削除してよい）
    volumes:
      - db_data:/var/lib/mysql
      - ./Application/SQL:/docker-entrypoint-initdb.d   # 初回起動時にSQL/配下を自動実行
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
