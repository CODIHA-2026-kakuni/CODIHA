# =====================================================================
# CODIHA 用 compose.yaml（汎用テンプレート）
#
# 想定: フロントエンド(Node.js/Vite等)のみのシンプルな構成。
# バックエンドやDBが必要になったら、下部のコメントを参考にサービスを追加してください。
#
# 使い方:
#   docker compose up          # 開発サーバー起動（ホットリロード）
#   docker compose up --build  # Dockerfile変更後の再ビルド込みで起動
#   docker compose down        # 停止・コンテナ削除
# =====================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev   # 開発用ステージを使用（本番確認したい場合は "production" に変更）
    ports:
      - "5173:5173"   # Vite想定。Next.js等の場合は "3000:3000" に変更
    volumes:
      - .:/app                # ソースをマウントしてホットリロードを有効化
      - /app/node_modules      # ホスト側のnode_modulesで上書きされないようにする
    environment:
      - NODE_ENV=development
      # - VITE_API_BASE_URL=http://localhost:8000  # バックエンドAPIを使う場合の例
    # .env ファイルを使う場合は以下を有効化
    # env_file:
    #   - .env
    stdin_open: true
    tty: true

# ---------------------------------------------------------------------
