# =====================================================================
# CODIHA 用 compose.yaml
#
# 構成: Express(Node.js) アプリ（Application/）+ MySQL
#
# 使い方:
#   docker compose up          # 開発サーバー起動
#   docker compose up --build  # Dockerfile変更後の再ビルド込みで起動
#   docker compose down        # 停止・コンテナ削除
#   docker compose down -v     # 停止・コンテナ・DBボリュームまで削除
#
# DBの初回起動時は Application/SQL 配下のSQLとCSVを自動で読み込む
# 認証値を変更する場合は .env.example をコピーして .env を作成する
# =====================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./Application:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-codiha}
      DB_PASSWORD: ${DB_PASSWORD:-codiha}
      DB_NAME: ${DB_NAME:-codiha}
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

  db:
    image: mysql:8.4
    restart: unless-stopped
    # LOAD DATA INFILEでSQL/配下のCSVを読み込めるようsecure_file_privの許可先を広げる
    command: --secure-file-priv=/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-codiha}
      MYSQL_USER: ${DB_USER:-codiha}
      MYSQL_PASSWORD: ${DB_PASSWORD:-codiha}
    ports:
      - "3306:3306"   # ホストから直接接続したい場合用（不要なら削除してよい）
    volumes:
      - db_data:/var/lib/mysql
      - ./Application/SQL:/docker-entrypoint-initdb.d   # 初回起動時にSQL/配下を自動実行
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
