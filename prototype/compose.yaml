services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-codiha}
      MYSQL_USER: ${MYSQL_USER:-codiha}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-codiha_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-codiha_root_dev}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-codiha}
      DB_USER: ${MYSQL_USER:-codiha}
      DB_PASSWORD: ${MYSQL_PASSWORD:-codiha_dev}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
